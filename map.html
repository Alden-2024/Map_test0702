<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D地图展示</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #map-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 18px;
            color: #333;
        }
        .fireworks-container {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1000;
        }
        @media (max-width: 768px) {
            #container {
                height: 80vh;
            }
        }
    </style>
    <!-- 引入高德地图JS API及3D建筑物插件 -->
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=114ed576e75cdd3e45d554742e2cf553&plugin=AMap.Buildings"></script>
    <!-- 引入fireworks-js库 -->
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.0/dist/index.umd.min.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="map-loading">地图加载中...</div>
    <canvas id="fireworks" class="fireworks-container"></canvas>

    <script>
        // 地图配置
        const MAP_CONFIG = {
            apiKey: '114ed576e75cdd3e45d554742e2cf553',
            center: [118.796875, 32.060255], // 南京中心点坐标
            zoom: 14, // 默认缩放级别
            pitch: 45, // 倾斜角度
            viewMode: '3D', // 3D视图模式
            rotationEnable: true, // 允许旋转
            resizeEnable: true, // 允许自适应容器大小
            rectangle: {
                path: [
                    [118.786875, 32.050255], // 矩形左下角
                    [118.806875, 32.050255], // 矩形右下角
                    [118.806875, 32.070255], // 矩形右上角
                    [118.786875, 32.070255]  // 矩形左上角
                ],
                strokeColor: '#3366FF', // 线条颜色
                strokeWeight: 3, // 线条宽度
                strokeOpacity: 0.8, // 线条透明度
                fillColor: '#8EC5FC', // 填充颜色
                fillOpacity: 0.3, // 填充透明度
                zIndex: 50, // 层级
                // 阴影样式，模拟3D效果
                shadowColor: '#000000',
                shadowBlur: 10,
                shadowOffsetX: 5,
                shadowOffsetY: 5
            }
        };

        // 初始化地图
        function initMap() {
            return new Promise((resolve, reject) => {
                const map = new AMap.Map('container', {
                    center: MAP_CONFIG.center,
                    zoom: MAP_CONFIG.zoom,
                    pitch: MAP_CONFIG.pitch,
                    viewMode: MAP_CONFIG.viewMode,
                    rotationEnable: MAP_CONFIG.rotationEnable,
                    resizeEnable: MAP_CONFIG.resizeEnable
                });

                // 加载3D建筑物图层
                AMap.plugin(['AMap.Buildings'], function() {
                    const buildings = new AMap.Buildings({
                        zooms: [10, 20],
                        heightFactor: 2 // 建筑物高度缩放因子
                    });
                    map.add(buildings);
                });

                // 绘制矩形
                const rectangle = new AMap.Polygon(MAP_CONFIG.rectangle);
                map.add(rectangle);

                // 添加信息窗口
                const infoWindow = new AMap.InfoWindow({
                    content: '<div style="padding:10px;">南京区域3D展示</div>',
                    offset: new AMap.Pixel(0, -30)
                });

                // 矩形点击事件
                rectangle.on('click', function(e) {
                    infoWindow.open(map, e.lnglat);
                });

                // 地图加载完成事件
                map.on('complete', function() {
                    document.getElementById('map-loading').style.display = 'none';
                    resolve(map);
                });

                // 地图加载失败事件
                map.on('error', function(error) {
                    console.error('地图加载失败:', error);
                    document.getElementById('map-loading').textContent = '地图加载失败，请刷新页面重试';
                    reject(error);
                });
            });
        }

        // 初始化烟花效果
        function initFireworks(map) {
            const canvas = document.getElementById('fireworks');
            const container = document.getElementById('container');
            const fireworks = new Fireworks.default(canvas, {
                autoresize: true,
                opacity: 0.5,
                acceleration: 1.05,
                friction: 0.97,
                gravity: 1.5,
                particles: 50,
                traceLength: 3,
                traceSpeed: 10,
                explosion: 5,
                intensity: 30,
                flickering: 50,
                lineWidth: { min: 1, max: 3 }
            });

            // 设置canvas大小
            function resizeCanvas() {
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
            }

            // 初始化大小
            resizeCanvas();
            // 窗口大小改变时调整
            window.addEventListener('resize', resizeCanvas);

            // 地图点击事件触发烟花
            map.on('click', function(e) {
                // 将经纬度转换为容器内像素坐标
                const pixel = map.lngLatToContainer(e.lnglat);
                // 触发烟花
                fireworks.launch(pixel.x, pixel.y);
            });

            // 启动烟花动画循环
            fireworks.start();
        }

        // 主函数
        async function init() {
            try {
                const map = await initMap();
                initFireworks(map);
            } catch (error) {
                console.error('初始化失败:', error);
            }
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
